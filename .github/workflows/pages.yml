name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pages
        run: python3 build/build.py
      # Publish the site at the root AND under /site/, so links work whether
      # Pages serves this workflow's output or the branch (where it lives in site/).
      - name: Assemble output
        run: |
          mkdir -p _out
          cp -r site/. _out/
          cp -r site _out/site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _out
      - id: deployment
        uses: actions/deploy-pages@v4
